name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- Primary gate: Icarus Verilog runs all testbenches. ----------------
  # Every bench $fatal's on error (non-zero exit), so `make` failing is enough
  # to fail the job. The explicit log checks below are belt-and-braces: they
  # also fail the job if a FAIL line appears or a bench reports anything other
  # than PASS, so a future change that weakened the exit code can't sneak a
  # red run through.
  icarus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog + Tcl
        run: sudo apt-get update && sudo apt-get install -y iverilog tcl python3

      - name: Build + run testbenches
        run: make | tee sim.log

      - name: Fail on any FAIL line
        run: "! grep -q 'FAIL' sim.log"

      - name: Require every bench to report PASS
        run: |
          total=$(grep -cE 'RESULT *:' sim.log)
          pass=$(grep -cE 'RESULT *: PASS' sim.log)
          echo "benches reporting a RESULT: $total, of which PASS: $pass"
          test "$total" -ge 1 && test "$pass" -eq "$total"

  # --- Secondary gate: Verilator elaborates + runs the concurrent SVA. ---
  # This proves rtl/jtag_sva.sv (the `assert property` form) is real and
  # passes on an SVA-capable simulator, not just that it parses.
  verilator-sva:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Run concurrent SVA
        run: make sva